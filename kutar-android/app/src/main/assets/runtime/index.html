<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kutar Touch</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d1b30;color:#f7f3fc;font-family:system-ui,sans-serif;touch-action:none;user-select:none}body{display:flex;flex-direction:column}#view{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;overflow:hidden}#stage{width:400px;height:300px;flex-shrink:0;position:relative;overflow:hidden;transform-origin:center}#canvas{position:absolute;width:640px!important;height:480px!important;left:-120px;top:-122px;outline:0}#stage.full{width:640px;height:480px}#stage.full #canvas{left:0;top:0}.bar{display:flex;gap:6px;padding:7px}.bar button{flex:1;min-width:0;height:44px;background:#40385d;color:white;border:1px solid #655a83;border-radius:9px;font-size:15px;touch-action:none}.bar .action{height:64px;background:#e7b56b;color:#211c2c;font-weight:700;font-size:21px}.bar button.down{background:#fff3db;transform:translateY(1px)}#statusline{font-size:12px;padding:4px 10px;color:#c7bddc}#debug{display:none;max-height:35%;overflow:auto;font-size:12px}#output{width:100%;height:160px;background:#111;color:#ddd}#compat{display:none}
</style></head><body>
<div id="statusline">正在启动原版游戏，请稍候……</div>
<div id="view"><div id="stage"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div></div>
<div class="bar"><button id="startgame">开始 F5</button><button id="resetgame">重置 F7</button><button id="confirmgame">确认</button><button id="toggleview">完整窗口</button><button id="togglelog">启动日志</button></div>
<div class="bar"><button class="action" id="left">左键</button><button class="action" id="right">右键</button></div>
<div id="debug"><textarea id="output" readonly></textarea></div>
<div id="compat"><div id="loading"><div id="spinner"></div><span id="status"></span><progress id="progress"></progress></div><div id="dropzone"></div><button id="startbtn"></button><span id="sound-checkbox"><input id="soundToggle" type="checkbox" checked></span><input id="showConsole" type="checkbox"><button id="uploadbtn"></button><button id="downloadbtn"></button></div>
<script src="boxedwine-shell.js"></script>
<script>
// Keep upstream runtime intact; configure its dedicated app launcher and local storage.
Config.storageMode=STORAGE_INDEXED_DB;
const canvas=document.getElementById('canvas'),stage=document.getElementById('stage'),view=document.getElementById('view');
let mouseMask=0;const keysHeld=new Set();
function fit(){const w=stage.classList.contains('full')?640:400,h=stage.classList.contains('full')?480:300;stage.style.transform='scale('+Math.min(view.clientWidth/w,view.clientHeight/h)+')'}
new ResizeObserver(fit).observe(view);fit();
function audioUnlock(){try{if(typeof SDL2!=='undefined'&&SDL2.audioContext)SDL2.audioContext.resume();if(Module.SDL2&&Module.SDL2.audioContext)Module.SDL2.audioContext.resume()}catch(e){}}
function mouse(button,down){audioUnlock();canvas.focus();const r=canvas.getBoundingClientRect();const options={bubbles:true,cancelable:true,button,buttons:mouseMask,clientX:r.left+r.width*.5,clientY:r.top+r.height*.57};canvas.dispatchEvent(new MouseEvent('mousemove',options));canvas.dispatchEvent(new MouseEvent(down?'mousedown':'mouseup',options))}
function keyboard(code,down){canvas.focus();const name=code===13?'Enter':code===116?'F5':'F7';canvas.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{key:name,code:name,keyCode:code,which:code,bubbles:true,cancelable:true}))}
for(const [id,button,mask] of [['left',0,1],['right',2,2]]){const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);mouseMask|=mask;b.classList.add('down');mouse(button,true)};const up=e=>{e.preventDefault();mouseMask&=~mask;b.classList.remove('down');mouse(button,false)};b.onpointerup=up;b.onpointercancel=up;b.onlostpointercapture=()=>{if(mouseMask&mask){mouseMask&=~mask;mouse(button,false);b.classList.remove('down')}}}
for(const [id,code] of [['startgame',116],['resetgame',118],['confirmgame',13]])document.getElementById(id).onclick=()=>{audioUnlock();keyboard(code,true);keysHeld.add(code);setTimeout(()=>{keyboard(code,false);keysHeld.delete(code)},90)};
function releaseControls(){for(const [button,mask] of [[0,1],[2,2]])if(mouseMask&mask){mouseMask&=~mask;mouse(button,false)}for(const k of keysHeld)keyboard(k,false);keysHeld.clear();document.querySelectorAll('.down').forEach(b=>b.classList.remove('down'))}
window.addEventListener('blur',releaseControls);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseControls()});
document.getElementById('toggleview').onclick=()=>{stage.classList.toggle('full');document.getElementById('toggleview').textContent=stage.classList.contains('full')?'游戏放大':'完整窗口';fit()};
document.getElementById('togglelog').onclick=()=>{const d=document.getElementById('debug');d.style.display=d.style.display==='block'?'none':'block';fit()};
let log=[];const upstreamPrint=Module.print;Module.print=function(text){log.push(String(text));if(log.length>150)log.shift();upstreamPrint(text);document.getElementById('output').value=log.join('\n');if(String(text).includes('Showing Window'))document.getElementById('statusline').textContent='游戏窗口已打开 · 等待标题画面后点“开始 F5”';};
Module.onAbort=reason=>{document.getElementById('statusline').textContent='运行失败，请打开启动日志并截图：'+String(reason).slice(0,100)};
Module.onExit=()=>{document.getElementById('statusline').textContent='游戏已退出，点击上方“换游戏”返回。'};
</script><script src="boxedwine.js"></script><script>
// Native SDL queues browser fullscreen on first input. Keep the touch controls visible.
if(typeof doRequestFullscreen==='function')doRequestFullscreen=()=>-1;
if(typeof Browser!=='undefined')Browser.requestFullscreen=()=>{};
</script></body></html>
