name: Mahjong Touch Android build probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-MAME4droid/**'
      - '.github/workflows/mahjongtouch-android.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Install Android SDK and NDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK (diagnostic)
        working-directory: android-MAME4droid
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK if produced
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mahjongtouch-upstream-debug-apk
          path: android-MAME4droid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
